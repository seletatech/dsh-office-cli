name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        include:
          - node: '22'
            sdk: legacy
          - node: '24.22.2'
            sdk: legacy
          - node: '24.22.2'
            sdk: current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install the legacy SDK compatibility fixture
        if: matrix.sdk == 'legacy'
        run: >-
          npm install --no-save --package-lock=false --ignore-scripts --legacy-peer-deps
          @deepseek-ai/cordis@4.0.1 @deepseek-ai/dsh-skill@0.1.0-rc.7
          @deepseek-ai/dsh-system-prompt@0.1.0-rc.7 @deepseek-ai/dsh-tools@0.1.0-rc.7
          @deepseek-ai/schemastery@3.18.1
          @deepseek-ai/dsh-agent@0.1.0-rc.7 @deepseek-ai/dsh-attachment@0.1.0-rc.7
          @deepseek-ai/dsh-brand@0.1.0-rc.7 @deepseek-ai/dsh-code-runtime@0.1.0-rc.7
          @deepseek-ai/dsh-invariants@0.1.0-rc.7 @deepseek-ai/dsh-llm@0.1.0-rc.7
          @deepseek-ai/dsh-scope@0.1.0-rc.7 @deepseek-ai/dsh-session@0.1.0-rc.7
          @deepseek-ai/dsh-timeout@0.1.0-rc.7 @deepseek-ai/dsh-typert-protocol@0.1.0-rc.7
          @deepseek-ai/dsh-user-approval@0.1.0-rc.7
      - run: npm run check
      - run: npm run pack:check
